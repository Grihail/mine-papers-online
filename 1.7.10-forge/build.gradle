plugins {
    id 'com.gtnewhorizons.retrofuturagradle'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
}

repositories {
    // Зеркало Forge отдаёт Scala-библиотеки 1.7.10 очень медленно — берём их с Maven Central.
    exclusiveContent {
        forRepository { mavenCentral() }
        filter {
            includeModule 'org.scala-lang', 'scala-library'
            includeModule 'org.scala-lang', 'scala-compiler'
            includeModule 'org.scala-lang', 'scala-reflect'
        }
    }
}

minecraft {
    mcVersion = '1.7.10'
    username = 'Developer'
}

// Библиотеки WebP распаковываются прямо в jar мода: вложенных jar в 1.7.10 нет.
configurations {
    shade
    implementation.extendsFrom shade
}

dependencies {
    webpLibs.each { shade it }
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from({ configurations.shade.collect { zipTree(it) } }) {
        // Манифесты, подписи и module-info (Java 9+) чужих jar не нужны — читатель WebP регистрируется в коде.
        exclude 'META-INF/**', 'module-info.class'
    }
}
