plugins {
    id 'net.neoforged.moddev'
}

// Узел Stonecutter на NeoForge (versions/<версия>-neoforge). Общий код и ресурсы (src/main, src/gametest этой папки) Stonecutter
// подключает сам, обработав условия //? для версии узла; код движка лежит в src узла. Версии — в gradle.properties узла.
stonecutter.constants.match('neoforge', 'fabric', 'neoforge', 'forge')

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(property('java_version') as int)
    }
}

// Игровые тесты (общие — src/gametest, обёртка NeoForge — src/gametest узла): в jar мода не попадают, их запускает сервер runGameTestServer.
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

neoForge {
    version = property('neoforge_version')
    addModdingDependenciesTo(sourceSets.gametest)

    runs {
        client {
            client()
        }
        server {
            server()
        }
        // Сервер прогоняет все тесты мода и выходит; упал хоть один — сборка с ошибкой.
        gameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.gametest
            systemProperty 'neoforge.enabledGameTestNamespaces', 'minepapers'
        }
    }

    mods {
        minepapers {
            sourceSet sourceSets.main
            sourceSet sourceSets.gametest
        }
    }
}

rootProject.tasks.named('gameTest') {
    dependsOn tasks.named('runGameTestServer')
}
