plugins {
    id 'net.neoforged.moddev.legacyforge'
}

// Узел Stonecutter на Forge (versions/<версия>-forge, Forge до 1.20.1). Общий код и ресурсы (src/main, src/gametest этой папки) Stonecutter
// подключает сам, обработав условия //? для версии узла; код движка и mods.toml лежат в src узла. Версии — в gradle.properties узла.
stonecutter.constants.match('forge', 'fabric', 'neoforge', 'forge')

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(property('java_version') as int)
    }
}

// Игровые тесты (общие — src/gametest, обёртка Forge — src/gametest узла): в jar мода не попадают, их запускает сервер runGameTestServer.
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

legacyForge {
    version = "${stonecutter.current.version}-${property('forge_version')}"
    addModdingDependenciesTo(sourceSets.gametest)

    runs {
        client {
            client()
        }
        server {
            server()
        }
        // Сервер прогоняет все тесты мода и выходит; упал хоть один — сборка с ошибкой.
        gameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.gametest
            systemProperty 'forge.enabledGameTestNamespaces', 'minepapers'
        }
    }

    mods {
        minepapers {
            sourceSet sourceSets.main
            sourceSet sourceSets.gametest
        }
    }
}

rootProject.tasks.named('gameTest') {
    dependsOn tasks.named('runGameTestServer')
}
