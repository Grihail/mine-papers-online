pluginManagement {
    repositories {
        maven {
            name = 'GTNH Maven'
            url = 'https://nexus.gtnewhorizons.com/repository/public/'
        }
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'Stonecutter'
            url = 'https://maven.kikugie.dev/releases'
        }
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    id 'dev.kikugie.stonecutter' version '0.9.8'
}

rootProject.name = 'MinePapersOnline'

// Подпроект на каждую пару "версия Minecraft + движок", имя — <версия>-<движок>. Общие для всех версий файлы лежат в common/ (см. build.gradle).

// Старые версии — каждая отдельно, в папке <версия>/<движок>.
[
    '1.7.10': ['forge'],
    '1.12.2': ['forge'],
].each { mc, loaders ->
    loaders.each { loader ->
        include "${mc}-${loader}"
        project(":${mc}-${loader}").projectDir = file("${mc}/${loader}")
    }
}

// Современные версии (Mojang-имена, 1.20+) — одно дерево Stonecutter в modern/: общий код в modern/src с условиями //? для версий
// и движков, код движка — в modern/versions/<версия>-<движок>/src, скрипт сборки — modern/<движок>.gradle.
// Активная версия (её код лежит в modern/src без комментариев) — vcsVersion; переключить — задачи "Set active project" Stonecutter.
stonecutter {
    create(':modern') {
        [
            '1.20.1': ['forge', 'fabric'],
            '1.21.1': ['neoforge', 'fabric'],
        ].each { mc, loaders ->
            loaders.each { loader -> version("${mc}-${loader}", mc).buildscript("${loader}.gradle") }
        }
        // Forge 26.x собирается другим плагином (ForgeGradle 7), поэтому у него свой скрипт.
        ['26.1.2', '26.2', '26.3'].each { mc -> version("${mc}-forge", mc).buildscript('forgegradle.gradle') }
        vcsVersion = '1.21.1-neoforge'
        kotlinController = false
    }
}

// Общий код без игры — только для его тестов (в jar версий он попадает исходниками).
include 'common'
