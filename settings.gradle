pluginManagement {
    repositories {
        maven {
            name = 'GTNH Maven'
            url = 'https://nexus.gtnewhorizons.com/repository/public/'
        }
        gradlePluginPortal()
        mavenCentral()
    }
}

rootProject.name = 'MinePapersOnline'

// Каждая пара "версия Minecraft + движок" — отдельный подпроект в папке <версия>-<движок>.
// Общие для всех версий файлы лежат в common/ (см. build.gradle).
include '1.7.10-forge'
include '1.21.1-neoforge'
