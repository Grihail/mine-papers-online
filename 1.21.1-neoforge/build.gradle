plugins {
    id 'net.neoforged.moddev'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

neoForge {
    version = '21.1.259'

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        minepapers {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // Библиотеки WebP — вложенными jar (Jar-in-Jar): если их принесёт и другой мод, NeoForge возьмёт одну, самую новую.
    webpLibs.each {
        jarJar(implementation(it))
        additionalRuntimeClasspath(it)
    }
}
