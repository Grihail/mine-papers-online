plugins {
    id 'java'
}

// Общий код без игры: здесь он компилируется отдельно только ради тестов (common/test). В моде он собирается в каждой
// версии из исходников (см. корневой build.gradle), поэтому jar отсюда не нужен.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
}

sourceSets {
    main {
        java.srcDirs = ['java']
        resources.srcDirs = ['resources']
    }
    test {
        java.srcDirs = ['test']
        resources.srcDirs = []
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Есть в игре любой версии; здесь — для компиляции и тестов.
    implementation 'com.google.code.gson:gson:2.8.9'
    implementation 'org.apache.logging.log4j:log4j-api:2.17.1'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar.enabled = false

test {
    useJUnitPlatform()
    testLogging {
        events 'failed'
        exceptionFormat = 'full'
    }
}
