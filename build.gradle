plugins {
    // Плагины сборки объявляются здесь, а применяются в подпроектах версий.
    id 'com.gtnewhorizons.retrofuturagradle' version '2.0.2' apply false
    id 'net.neoforged.moddev' version '2.0.148' apply false
}

/** Сравнение версий Minecraft по числам: "1.7.10" < "1.13" < "1.21.1". */
def compareVersions = { String a, String b ->
    def x = a.tokenize('.')*.toInteger()
    def y = b.tokenize('.')*.toInteger()
    for (i in 0..<Math.max(x.size(), y.size())) {
        int d = (x[i] ?: 0) <=> (y[i] ?: 0)
        if (d) return d
    }
    0
}

// Общие настройки для всех подпроектов (папки <версия Minecraft>-<движок>/: 1.7.10-forge/, 1.21.1-neoforge/, ...).
// Общие файлы лежат в common/:
//   java/      — исходники, одинаковые для всех версий (только Java 8 и без API Minecraft);
//   resources/ — ресурсы в раскладке 1.13+ (textures/block, textures/item), до 1.13 папки переименовываются в blocks/items;
//   lang/      — словари в формате 1.13+ (en_us.json); ключи одинаковы для всех версий.
//                До 1.13 при сборке они превращаются в .lang: в 1.11–1.12.2 — en_us.lang, до 1.11 — en_US.lang.
subprojects {
    apply plugin: 'java'

    // Версия Minecraft — первая часть имени подпроекта: 1.21.1-neoforge -> 1.21.1
    def mcVersion = project.name.tokenize('-')[0]

    group = mod_group
    version = mod_version

    base {
        // MinePapersOnline-1.21.1-neoforge-1.3.0.jar
        archivesName = "${mod_name}-${project.name}"
    }

    sourceSets.main.java.srcDir rootProject.file('common/java')

    // Чтение WebP: плагин ImageIO от TwelveMonkeys (Java 8). Мод не компилируется с ним: в jar попадает версия, ужатая ProGuard (см. shrinkWebp).
    repositories { mavenCentral() }
    configurations {
        webp
        proguard
    }
    dependencies {
        // Остальные пять jar (imageio-core, imageio-metadata, common-image, common-io, common-lang) приходят как её зависимости.
        webp 'com.twelvemonkeys.imageio:imageio-webp:3.15.3'
        proguard 'com.guardsquare:proguard-base:7.6.1'
    }

    // ProGuard оставляет от библиотек WebP только читатель WebP и то, что ему нужно (~500 КБ -> ~90 КБ), и переносит классы
    // в пакет com.grihail.minepapers.lib. Правила - в common/proguard/webp.pro, таблица имён (для разбора стека) - в build/webp/mapping.txt.
    def webpJar = layout.buildDirectory.file('webp/webp.jar')
    def shrinkWebp = tasks.register('shrinkWebp', JavaExec) {
        def libs = configurations.webp
        def rules = rootProject.file('common/proguard')
        def mapping = layout.buildDirectory.file('webp/mapping.txt')
        inputs.files(libs)
        inputs.dir(rules)
        outputs.file(webpJar)
        outputs.file(mapping)
        classpath = configurations.proguard
        mainClass = 'proguard.ProGuard'
        // Пути с пробелами ProGuard понимает только в кавычках, поэтому они передаются файлом paths.pro из рабочей папки.
        workingDir = temporaryDir
        args '@paths.pro'
        doFirst {
            def quoted = { File f -> "'${f.absolutePath.replace('\\', '/')}'" }
            // Классы JDK, на которые ссылаются библиотеки, - из JDK версии игры (ProGuard запускается на нём же): rt.jar в Java 8, модули в Java 9+.
            def home = javaLauncher.get().metadata.installationPath.asFile
            def rt = new File(home, 'jre/lib/rt.jar')
            def jdk = rt.exists() ? [quoted(rt)]
                : ['java.base', 'java.desktop', 'java.xml', 'java.datatransfer', 'java.sql'].collect { quoted(new File(home, "jmods/${it}.jmod")) + '(!**.jar;!module-info.class)' }
            new File(temporaryDir, 'paths.pro').text = (
                libs.collect { "-injars ${quoted(it)}(!META-INF/**,!module-info.class,**.class)" } +
                jdk.collect { "-libraryjars ${it}" } +
                // Без -forceprocessing ProGuard пропускает работу, если jar новее входов, даже когда поменялись правила. Когда запускать, решает Gradle.
                ["-outjars ${quoted(webpJar.get().asFile)}", "-printmapping ${quoted(mapping.get().asFile)}", '-forceprocessing', "-include ${quoted(new File(rules, 'webp.pro'))}"]
            ).join('\n')
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
    // В классах мода только номера строк (для крашрепортов), без имён локальных переменных: jar меньше на ~30 КБ.
    tasks.named('compileJava') {
        options.debugOptions.debugLevel = 'source,lines'
    }

    def legacyTextures = compareVersions(mcVersion, '1.13') < 0
    def legacyLang = compareVersions(mcVersion, '1.13') < 0
    def upperCaseRegion = compareVersions(mcVersion, '1.11') < 0
    def langSrc = rootProject.file('common/lang')

    // Словари для версий до 1.13: en_us.json -> en_us.lang (1.11–1.12.2) или en_US.lang (до 1.11).
    // Строки .lang — "ключ=значение"; переносы строк в значении записываются как \n.
    def convertLang = tasks.register('convertLang') {
        def out = layout.buildDirectory.dir('generated/lang')
        inputs.dir langSrc
        inputs.property 'mcversion', mcVersion
        outputs.dir out
        doLast {
            def dir = out.get().asFile
            project.delete(dir)
            dir.mkdirs()
            langSrc.listFiles().findAll { it.name.endsWith('.json') }.each { json ->
                def entries = new groovy.json.JsonSlurper().parse(json, 'UTF-8') as Map
                def (lang, region) = (json.name - '.json').tokenize('_')
                def name = "${lang}_${upperCaseRegion ? region.toUpperCase() : region}.lang"
                new File(dir, name).withWriter('UTF-8') { w ->
                    entries.each { k, v -> w << k << '=' << v.toString().replace('\r', '').replace('\n', '\\n') << '\n' }
                }
            }
        }
    }

    processResources {
        filteringCharset = 'UTF-8'
        inputs.property 'version', project.version
        inputs.property 'mcversion', mcVersion
        filesMatching(['mcmod.info', 'version.properties', 'META-INF/neoforge.mods.toml']) {
            expand 'version': project.version, 'mcversion': mcVersion
        }

        from(rootProject.file('common/resources')) {
            if (legacyTextures) {
                eachFile { it.path = it.path.replaceFirst('/textures/(block|item)/', '/textures/$1s/') }
            }
        }
        from(legacyLang ? convertLang : langSrc) {
            into 'assets/minepapers/lang'
        }
        // Ужатые классы библиотек WebP идут вместе с ресурсами: так они попадают и в jar мода, и в запуск из среды разработки (runClient).
        dependsOn shrinkWebp
        from({ zipTree(webpJar) })
    }
}
