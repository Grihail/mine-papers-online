plugins {
    // Плагины сборки объявляются здесь, а применяются в подпроектах версий.
    id 'com.gtnewhorizons.retrofuturagradle' version '2.0.2' apply false
    id 'net.neoforged.moddev' version '2.0.148' apply false
}

// Общие настройки для всех подпроектов версий Minecraft (папки 1.7.10/, ...).
subprojects {
    apply plugin: 'java'

    group = mod_group
    version = mod_version

    base {
        // Имя папки подпроекта и есть версия Minecraft: MinePapersOnline-1.7.10-1.2.1.jar
        archivesName = "${mod_name}-${project.name}"
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    processResources {
        inputs.property 'version', project.version
        inputs.property 'mcversion', project.name
        filesMatching(['mcmod.info', 'META-INF/neoforge.mods.toml']) {
            expand 'version': project.version, 'mcversion': project.name
        }
    }
}
