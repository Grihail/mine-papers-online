plugins {
    id 'net.neoforged.moddev'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// Код и ресурсы версии без движка (1.21.1/shared) — те же, что у Fabric.
// Игровые тесты (общие — shared/src/gametest, обёртка NeoForge — src/gametest): в jar мода не попадают, их запускает сервер runGameTestServer.
sourceSets {
    main {
        java.srcDir '../shared/src/main/java'
        resources.srcDir '../shared/src/main/resources'
    }
    gametest {
        java.srcDir '../shared/src/gametest/java'
        resources.srcDir '../shared/src/gametest/resources'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

neoForge {
    version = '21.1.259'
    addModdingDependenciesTo(sourceSets.gametest)

    runs {
        client {
            client()
        }
        server {
            server()
        }
        // Сервер прогоняет все тесты мода и выходит; упал хоть один — сборка с ошибкой.
        gameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.gametest
            systemProperty 'neoforge.enabledGameTestNamespaces', 'minepapers'
        }
    }

    mods {
        minepapers {
            sourceSet sourceSets.main
            sourceSet sourceSets.gametest
        }
    }
}

rootProject.tasks.named('gameTest') {
    dependsOn tasks.named('runGameTestServer')
}
