plugins {
    id 'fabric-loom'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// Код и ресурсы версии без движка (1.21.1/shared) — те же, что у NeoForge.
// Игровые тесты (общие — shared/src/gametest, обёртка Fabric — src/gametest) — отдельный мод minepapers-gametest: в jar мода не попадают.
sourceSets {
    main {
        java.srcDir '../shared/src/main/java'
        resources.srcDir '../shared/src/main/resources'
    }
    gametest {
        java.srcDir '../shared/src/gametest/java'
        resources.srcDir '../shared/src/gametest/resources'
        compileClasspath += main.compileClasspath + main.output
        runtimeClasspath += main.runtimeClasspath + main.output
    }
}

loom {
    accessWidenerPath = file('src/main/resources/minepapers.accesswidener')

    mods {
        minepapers {
            sourceSet sourceSets.main
        }
        minepapers_gametest {
            sourceSet sourceSets.gametest
        }
    }

    runs {
        // Сервер прогоняет все тесты и выходит; упал хоть один — сборка с ошибкой.
        gametest {
            server()
            name 'Game Test'
            source sourceSets.gametest
            vmArg '-Dfabric-api.gametest'
            vmArg "-Dfabric-api.gametest.report-file=${layout.buildDirectory.file('gametest/report.xml').get().asFile}"
            runDir 'build/gametest'
        }
    }
}

dependencies {
    minecraft 'com.mojang:minecraft:1.21.1'
    // Имена Mojang — те же, что у NeoForge: общий код версии компилируется без изменений.
    mappings loom.officialMojangMappings()
    modImplementation 'net.fabricmc:fabric-loader:0.19.5'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.116.17+1.21.1'
}

rootProject.tasks.named('gameTest') {
    dependsOn tasks.named('runGametest')
}
